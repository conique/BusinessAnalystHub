<script type="text/plain" id="app-script">

let db = lerBancoDeDados();


let ordenacaoAtual = null;
let direcaoOrdenacao = 1;

let pastaAtual = new URLSearchParams(location.search).get('pasta') || null;
const preferenciasUsuario = lerPreferenciasBanco();
let visaoAtual = preferenciasUsuario.visao === 'kanban' ? 'kanban' : 'tabela';

const ordenacaoSalva = preferenciasUsuario.ordenacao;
if (ordenacaoSalva && ['nome', 'rotulo', 'area', 'prazo'].includes(ordenacaoSalva.tipo)) {
    ordenacaoAtual = ordenacaoSalva.tipo;
    direcaoOrdenacao = ordenacaoSalva.dir === -1 ? -1 : 1;
}


const ordemRotulos = [
    'Em andamento',
    'Esperando',
    'Atrasado',
    'A ser feito',
    'Pronto'
];


let opcoesRotulos =
    JSON.parse(
        localStorage.getItem('bahub_opcoes_rotulos')
    ) || [
        {
            nome:'Em andamento',
            cor:'blue'
        },
        {
            nome:'Pronto',
            cor:'green'
        },
        {
            nome:'Atrasado',
            cor:'red'
        },
        {
            nome:'A ser feito',
            cor:'gray'
        }
    ];


/* Garante todos os rótulos e a ordem padrão (também em dados já salvos no navegador). */
const CORES_PADRAO_ROTULO = {
    'Em andamento':'blue','Esperando':'#a855f7','Atrasado':'red','A ser feito':'gray','Pronto':'green'
};
ordemRotulos.forEach(nome => {
    if (!opcoesRotulos.some(r => r.nome === nome)) {
        opcoesRotulos.push({ nome, cor: CORES_PADRAO_ROTULO[nome] });
    }
});
opcoesRotulos.sort((a, b) => {
    const pa = ordemRotulos.indexOf(a.nome), pb = ordemRotulos.indexOf(b.nome);
    return (pa === -1 ? 99 : pa) - (pb === -1 ? 99 : pb);
});
const rotuloEsperando = opcoesRotulos.find(r => r.nome === 'Esperando');
if (rotuloEsperando && rotuloEsperando.cor !== '#a855f7') {
    rotuloEsperando.cor = '#a855f7';
    localStorage.setItem('bahub_opcoes_rotulos', JSON.stringify(opcoesRotulos));
}

let opcoesArea =
    JSON.parse(
        localStorage.getItem('bahub_opcoes_area')
    ) || [
        'Projeto',
        'Melhoria',
        'Tarefa',
        'Gerais',
        'BI e SSAPM'
    ];


function salvarOpcoesGlobais() {

    localStorage.setItem(
        'bahub_opcoes_rotulos',
        JSON.stringify(opcoesRotulos)
    );

    localStorage.setItem(
        'bahub_opcoes_area',
        JSON.stringify(opcoesArea)
    );

}


const MAPA_CORES={blue:'#0ea5e9',green:'#10b981',red:'#dc2626',gray:'#4b5563',purple:'#a855f7'};
function obterCorRotulo(nome) {

    const r =
        opcoesRotulos.find(
            x => x.nome === nome
        );

    const c = r ? r.cor : 'blue';
    return MAPA_CORES[c] || c;

}


function ordenarPor(tipo) {

    if (ordenacaoAtual === tipo) {

        direcaoOrdenacao *= -1;

    } else {

        ordenacaoAtual = tipo;
        direcaoOrdenacao = 1;

    }

    salvarPreferenciasBanco({
        ...lerPreferenciasBanco(),
        ordenacao: { tipo: ordenacaoAtual, dir: direcaoOrdenacao }
    });
    renderizarTabela();

}


/* Ordem de exibição: a personalizada (a do banco) ou a ordenação temporária por coluna. */
function calcularOrdemVisual() {

    const tipo = ordenacaoAtual;

    const nivel = db.map((_, i) => i).filter(i => (db[i].pai || null) === (pastaAtual || null));

    if (!tipo) {
        return nivel;
    }

    return nivel.sort((ia, ib) => {

        const a = db[ia];
        const b = db[ib];


        if (tipo === 'nome') {

            return String(a.nome || '')
                .localeCompare(
                    String(b.nome || ''),
                    'pt-BR',
                    {
                        sensitivity:'base'
                    }
                ) * direcaoOrdenacao;

        }


        if (tipo === 'rotulo') {

            const posA =
                ordemRotulos.indexOf(
                    a.rotulo || 'Em andamento'
                );

            const posB =
                ordemRotulos.indexOf(
                    b.rotulo || 'Em andamento'
                );


            const ordemA =
                posA === -1
                    ? ordemRotulos.length
                    : posA;


            const ordemB =
                posB === -1
                    ? ordemRotulos.length
                    : posB;


            return (
                ordemA - ordemB
            ) * direcaoOrdenacao;

        }


        if (tipo === 'area') {

            return String(a.area || '')
                .localeCompare(
                    String(b.area || ''),
                    'pt-BR',
                    {
                        sensitivity:'base'
                    }
                ) * direcaoOrdenacao;

        }


        if (tipo === 'prazo') {

            const prazoA =
                a.prazo;

            const prazoB =
                b.prazo;


            const semA =
                !prazoA ||
                prazoA === '---';


            const semB =
                !prazoB ||
                prazoB === '---';


            if (semA && semB)
                return 0;


            if (semA)
                return 1;


            if (semB)
                return -1;


            return (
                new Date(
                    prazoA + 'T00:00:00'
                ) -
                new Date(
                    prazoB + 'T00:00:00'
                )
            ) * direcaoOrdenacao;

        }


        return 0;

    });

}


function renderizarTabela() {

    const tbody =
        document.getElementById(
            'corpo-tabela'
        );


    tbody.innerHTML = '';


    if (!db.length) {

        document.getElementById(
            'estado-vazio'
        ).style.display = 'block';


        document.getElementById(
            'conteudo-tabela'
        ).style.display = 'none';


        return;

    }


    document.getElementById(
        'estado-vazio'
    ).style.display = 'none';


    document.getElementById(
        'conteudo-tabela'
    ).style.display = 'block';


    validarPastaAtual();
    if (pastaAtual) tbody.appendChild(criarLinhaVoltar());
    const nivelAtual = calcularOrdemVisual();
    if (pastaAtual && !nivelAtual.length) tbody.appendChild(criarLinhaVazia());
    nivelAtual.forEach(index => {

        const projeto = db[index];

        const tr =
            document.createElement('tr');


        tr.id =
            `linha-projeto-${index}`;
        if (projeto.tipo === 'pasta') tr.className = 'linha-pasta';


        tr.onclick = e => {

            if (
                tr.classList.contains(
                    'em-edicao'
                )
            ) {
                return;
            }


            if (
                !e.target.closest(
                    '.col-acoes'
                ) &&
                !e.target.closest(
                    'select'
                ) &&
                !e.target.closest(
                    'input'
                ) &&
                !e.target.closest(
                    'button'
                )
            ) {

                if (projeto.tipo === 'pasta') irParaPasta(projeto.id);
                else location.href = `cards.html?id=${index}`;

            }

        };


        const rotulo =
            projeto.rotulo ||
            'Em andamento';


        const area =
            projeto.area ||
            'Projeto';


        let prazo =
            projeto.prazo ||
            '---';


        if (
            prazo !== '---' &&
            prazo.includes('-')
        ) {

            const p =
                prazo.split('-');


            if (p.length === 3) {

                prazo =
                    `${p[2]}/${p[1]}/${p[0]}`;

            }

        }


        tr.innerHTML = `

            <td>

                <div class="col-nome">

                    <span class="alca-arrastar" title="Arraste para mover">⠿</span>

                    <span>${projeto.tipo === 'pasta' ? '📁' : '📄'}</span>

                    <span class="titulo-linha">${escapeHTML(projeto.nome)}</span>
                    ${projeto.tipo === 'pasta' ? `<span class="pasta-contagem">· ${contarFilhos(projeto.id)} ${contarFilhos(projeto.id) === 1 ? 'item' : 'itens'}</span>` : ''}
                    <span class="tags-linha">${(projeto.tags || []).map(htmlTagBolha).join('')}</span>
                    <button type="button" class="btn-tag-mais" onclick="abrirPopTags(event, ${index})" title="Adicionar tag" aria-label="Adicionar tag">+</button>

                </div>

            </td>


            <td>

                <span
                    class="selo"
                    style="--glow:${obterCorRotulo(rotulo)}"
                >
                    ${escapeHTML(rotulo)}
                </span>

            </td>


            <td>

                <span class="pilula-area">
                    ${escapeHTML(area)}
                </span>

            </td>


            <td>
                ${prazo}
            </td>


            <td class="col-acoes">

                <button
                    class="btn-tabela-opcoes"
                    onclick="alternarMenuTabela(event,${index})"
                >
                    ⋮
                </button>


                <div
                    class="menu-tabela-flutuante"
                    id="menu-tabela-${index}"
                >

                    <button
                        onclick="ativarEdicaoCompleta(${index})"
                    >
                        Editar
                    </button>


                    <button
                        onclick="${projeto.tipo === 'pasta' ? 'excluirPasta' : 'deletarProjeto'}(${index})"
                        style="color:#ff4d4d"
                    >
                        Deletar
                    </button>

                </div>

            </td>

        `;


        tbody.appendChild(tr);

    });

}


function escapeHTML(v) {

    return String(v ?? '')
        .replace(
            /[&<>"']/g,
            c => ({
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                '"':'&quot;',
                "'":'&#039;'
            }[c])
        );

}


function alternarMenuTabela(
    event,
    index
) {

    event.stopPropagation();


    document
        .querySelectorAll(
            '.menu-tabela-flutuante'
        )
        .forEach((m, i) => {

            if (i !== index) {
                m.style.display = 'none';
            }

        });


    const menu =
        document.getElementById(
            `menu-tabela-${index}`
        );


    const abrir = menu.style.display !== 'block';
    menu.style.display = abrir ? 'block' : 'none';
    if (!abrir) return;

    /* Menu "fixed": não é cortado pela rolagem/bordas da tabela. */
    const caixa = event.currentTarget.getBoundingClientRect();
    const altura = menu.offsetHeight;
    const cabeAbaixo = caixa.bottom + 6 + altura <= window.innerHeight;
    menu.style.position = 'fixed';
    menu.style.left = 'auto';
    menu.style.right = (window.innerWidth - caixa.right) + 'px';
    menu.style.top = (cabeAbaixo ? caixa.bottom + 6 : Math.max(8, caixa.top - 6 - altura)) + 'px';

}


window.addEventListener('scroll', () =>
    document.querySelectorAll('.menu-tabela-flutuante')
        .forEach(m => m.style.display = 'none'), true);
window.onclick = () =>
    document
        .querySelectorAll(
            '.menu-tabela-flutuante'
        )
        .forEach(
            m => m.style.display = 'none'
        );


function abrirModal() {

    document.getElementById(
        'modalNovaPagina'
    ).style.display = 'flex';


    setTimeout(
        () =>
            document
                .getElementById(
                    'nomePagina'
                )
                .focus(),
        50
    );

}


function fecharModal() {

    document.getElementById(
        'modalNovaPagina'
    ).style.display = 'none';

}


async function salvarNovoProjeto() {

    const nome =
        document
            .getElementById(
                'nomePagina'
            )
            .value
            .trim();


    if (!nome)
        return;


    const area =
        document.querySelector(
            'input[name="tipoPagina"]:checked'
        ).value;


    db.push({

        nome,

        rotulo:
            opcoesRotulos[0]?.nome ||
            'Em andamento',

        area,

        prazo:'---',

        pai: pastaAtual || null,
        cards:[]

    });


    salvarBancoDeDados(db);
    await descarregarNuvem();
    location.href =
        `cards.html?id=${db.length - 1}`;

}


document
    .getElementById('nomePagina')
    .addEventListener(
        'keydown',
        e => {

            if (e.key === 'Enter')
                salvarNovoProjeto();


            if (e.key === 'Escape')
                fecharModal();

        }
    );


function ativarEdicaoCompleta(index) {

    const p =
        db[index];


    const tr =
        document.getElementById(
            `linha-projeto-${index}`
        );


    tr.classList.add(
        'em-edicao'
    );


    document
        .getElementById(
            `nome-container-${index}`
        )
        ?.remove();


    tr.innerHTML = `

        <td>

            <input
                id="edit-nome-${index}"
                class="input-inline-tabela"
                value="${escapeHTML(p.nome)}"
            >

        </td>


        <td>

            <select
                id="edit-rotulo-${index}"
                class="select-inline-tabela"
            >

                ${opcoesRotulos
                    .map(
                        r =>
                            `<option
                                ${r.nome === p.rotulo ? 'selected' : ''}
                            >
                                ${escapeHTML(r.nome)}
                            </option>`
                    )
                    .join('')
                }

            </select>

        </td>


        <td>

            <select
                id="edit-area-${index}"
                class="select-inline-tabela"
            >

                ${opcoesArea
                    .map(
                        a =>
                            `<option
                                ${a === p.area ? 'selected' : ''}
                            >
                                ${escapeHTML(a)}
                            </option>`
                    )
                    .join('')
                }

            </select>

        </td>


        <td>

            <input
                type="date"
                id="edit-prazo-${index}"
                class="input-inline-tabela"
                value="${
                    p.prazo &&
                    p.prazo !== '---'
                        ? p.prazo
                        : ''
                }"
            >

        </td>


        <td class="col-acoes">

            <button
                class="btn-salvar-inline"
                onclick="salvarEdicaoCompleta(${index})"
            >
                Salvar
            </button>

        </td>

    `;

}


function salvarEdicaoCompleta(index) {

    const nome =
        document
            .getElementById(
                `edit-nome-${index}`
            )
            .value
            .trim();


    if (!nome) {

        alert(
            'O título do projeto não pode ser vazio.'
        );

        return;

    }


    db[index].nome =
        nome;


    db[index].rotulo =
        document
            .getElementById(
                `edit-rotulo-${index}`
            )
            .value;


    db[index].area =
        document
            .getElementById(
                `edit-area-${index}`
            )
            .value;


    db[index].prazo =
        document
            .getElementById(
                `edit-prazo-${index}`
            )
            .value ||
        '---';


    salvarBancoDeDados(db);

    renderizarTabela();

}


function deletarProjeto(index) {

    if (
        confirm(
            `Tem certeza que deseja deletar o projeto "${db[index].nome}"?`
        )
    ) {

        db.splice(
            index,
            1
        );


        salvarBancoDeDados(db);

        renderizarTabela();

    }

}


/* ---------- Tags dos projetos: criar, escolher existente, cor e remover ---------- */
const CORES_TAG = [
    '#3b82f6', '#22c55e', '#ef4444', '#f97316', '#eab308', '#a855f7',
    '#ec4899', '#14b8a6', '#6366f1', '#92400e', '#6b7280'
];
let popTags = null;

function tagsExistentes() {
    const mapa = new Map();
    db.forEach(p => (p.tags || []).forEach(tg => {
        const k = tg.nome.toLowerCase() + '|' + tg.cor;
        if (!mapa.has(k)) mapa.set(k, { nome: tg.nome, cor: tg.cor });
    }));
    return [...mapa.values()].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
}

function fecharPopTags() {
    if (popTags) { popTags.el.remove(); popTags = null; }
}

function abrirPopTags(event, index) {
    event.stopPropagation();
    if (popTags && popTags.index === index) return fecharPopTags();
    fecharPopTags();
    const el = document.createElement('div');
    el.className = 'pop-tags';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', 'Tags do item');
    popTags = { index, el, cor: CORES_TAG[0], livres: [] };
    document.body.appendChild(el);

    el.addEventListener('click', e => {
        const b = e.target.closest('[data-acao]');
        if (!b) return;
        const acao = b.dataset.acao;
        if (acao === 'cor') definirCorPop(b.dataset.cor);
        else if (acao === 'remover') removerTag(Number(b.dataset.i));
        else if (acao === 'usar') adicionarTag(popTags.livres[Number(b.dataset.i)]);
        else if (acao === 'criar') criarTag();
    });
    el.addEventListener('input', e => {
        if (e.target.id === 'tag-cor-custom') definirCorPop(e.target.value);
    });
    el.addEventListener('keydown', e => {
        if (e.key === 'Enter' && e.target.id === 'tag-nome') { e.preventDefault(); criarTag(); }
    });

    desenharPopTags();
    posicionarPopTags();
    const campo = el.querySelector('#tag-nome');
    if (campo) campo.focus();
}

function desenharPopTags() {
    const atuais = db[popTags.index].tags || [];
    const livres = tagsExistentes().filter(tg => !atuais.some(a => a.nome.toLowerCase() === tg.nome.toLowerCase()));
    popTags.livres = livres;
    const estilo = c => `background:${c.cor};color:${corTextoTag(c.cor)}`;
    popTags.el.innerHTML = `
        ${atuais.length ? `<div class="pop-sec"><div class="pop-tit">Neste item</div><div class="pop-chips">
            ${atuais.map((tg, i) => `<span class="tag-bolha tag-removivel" style="${estilo(tg)}">${escapeHTML(tg.nome)}<button type="button" data-acao="remover" data-i="${i}" aria-label="Remover tag ${escapeHTML(tg.nome)}">×</button></span>`).join('')}
        </div></div>` : ''}
        ${livres.length ? `<div class="pop-sec"><div class="pop-tit">Tags existentes</div><div class="pop-chips">
            ${livres.map((tg, i) => `<button type="button" class="tag-bolha tag-escolher" data-acao="usar" data-i="${i}" style="${estilo(tg)}">${escapeHTML(tg.nome)}</button>`).join('')}
        </div></div>` : ''}
        <div class="pop-sec"><div class="pop-tit">Nova tag</div>
            <input id="tag-nome" class="pop-input" maxlength="24" placeholder="Nome da tag" autocomplete="off">
            <div class="pop-cores">
                ${CORES_TAG.map(c => `<button type="button" class="cor-opcao${c === popTags.cor ? ' sel' : ''}" data-acao="cor" data-cor="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`).join('')}
                <label class="cor-opcao cor-custom${CORES_TAG.includes(popTags.cor) ? '' : ' sel'}" title="Outra cor"><input type="color" id="tag-cor-custom" value="${popTags.cor}"></label>
            </div>
            <button type="button" class="btn-salvar-inline pop-criar" data-acao="criar">Adicionar</button>
        </div>`;
}

function definirCorPop(cor) {
    popTags.cor = cor;
    popTags.el.querySelectorAll('.cor-opcao').forEach(b => b.classList.remove('sel'));
    const pre = popTags.el.querySelector(`.cor-opcao[data-cor="${cor}"]`);
    (pre || popTags.el.querySelector('.cor-custom')).classList.add('sel');
}

function posicionarPopTags() {
    const btn = document.querySelector(`${visaoAtual === 'kanban' ? '#kb-card-' : '#linha-projeto-'}${popTags.index} .btn-tag-mais`);
    if (!btn) return fecharPopTags();
    const r = btn.getBoundingClientRect(), el = popTags.el;
    el.style.maxHeight = (window.innerHeight - 16) + 'px';
    const w = el.offsetWidth, h = el.offsetHeight;
    const left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - 6 - h);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
}

function atualizarAposTag() {
    salvarBancoDeDados(db);
    renderizarTabela();
    desenharPopTags();
    posicionarPopTags();
}

function adicionarTag(tag) {
    if (!tag) return;
    const p = db[popTags.index];
    p.tags = p.tags || [];
    if (p.tags.some(x => x.nome.toLowerCase() === tag.nome.toLowerCase())) return;
    p.tags.push({ nome: tag.nome, cor: tag.cor });
    atualizarAposTag();
}

function criarTag() {
    const campo = popTags.el.querySelector('#tag-nome');
    const nome = campo.value.trim().slice(0, 24);
    if (!nome) { campo.focus(); return; }
    adicionarTag({ nome, cor: popTags.cor });
    const novo = popTags.el.querySelector('#tag-nome');
    if (novo) novo.focus();
}

function removerTag(i) {
    const p = db[popTags.index];
    (p.tags || []).splice(i, 1);
    atualizarAposTag();
}

document.addEventListener('pointerdown', e => {
    if (popTags && !popTags.el.contains(e.target) && !e.target.closest('.btn-tag-mais')) fecharPopTags();
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharPopTags(); });
window.addEventListener('resize', () => { if (popTags) posicionarPopTags(); });
window.addEventListener('scroll', () => { if (popTags) posicionarPopTags(); }, true);

/* ---------- Ordem personalizada: segurar e arrastar as linhas ---------- */
/* ---------- Visão Kanban: colunas por rótulo, arraste entre colunas muda o rótulo ---------- */
function mudarVisao(v) {
    visaoAtual = v;
    salvarPreferenciasBanco({ ...lerPreferenciasBanco(), visao: v });
    renderizarTabela();
}

function aplicarVisao() {
    const kb = document.getElementById('kanban');
    const caixa = document.getElementById('conteudo-tabela');
    const slot = document.getElementById('topo-visao');
    if (!kb || !caixa) return;
    const vazio = !db.length;
    const kanban = visaoAtual === 'kanban';
    if (slot) {
        slot.hidden = vazio;
        slot.innerHTML = `<span class="visao-toggle" role="group" aria-label="Visualização">
            <button type="button" class="${visaoAtual === 'tabela' ? 'on' : ''}" onclick="mudarVisao('tabela')">Tabela</button>
            <button type="button" class="${kanban ? 'on' : ''}" onclick="mudarVisao('kanban')" title="Colunas por rótulo. Arraste os cards entre colunas e arraste o título da coluna para reordenar">Kanban</button></span>`;
    }
    kb.hidden = vazio || !kanban;
    if (kanban && !vazio) {
        caixa.style.display = 'none';
        renderizarKanban();
    }
}

function htmlCardKanban(i) {
    const p = db[i], pasta = p.tipo === 'pasta';
    const cor = obterCorRotulo(p.rotulo || opcoesRotulos[0].nome);
    const prazoBruto = p.prazo && p.prazo !== '---' ? p.prazo : '';
    const prazo = /^\d{4}-\d{2}-\d{2}$/.test(prazoBruto) ? prazoBruto.split('-').reverse().join('/') : prazoBruto;
    const n = pasta ? contarFilhos(p.id) : 0;
    return `<article class="kb-card${pasta ? ' kb-pasta' : ''}" id="kb-card-${i}" data-idx="${i}" style="--cor-card:${cor}">
        <div class="kb-card-topo">
            <span class="kb-titulo">${pasta ? '📁 ' : ''}${escapeHTML(p.nome)}</span>
            <span class="alca-arrastar kb-alca" title="Arraste para mover">⠿</span>
        </div>
        <div class="kb-meta">
            ${p.area ? `<span class="pilula-area">${escapeHTML(p.area)}</span>` : ''}
            ${prazo ? `<span class="kb-prazo">📅 ${escapeHTML(prazo)}</span>` : ''}
            ${pasta ? `<span class="pasta-contagem">${n} ${n === 1 ? 'item' : 'itens'}</span>` : ''}
        </div>
        <div class="kb-tags">${(p.tags || []).map(htmlTagBolha).join('')}<button type="button" class="btn-tag-mais" onclick="abrirPopTags(event, ${i})" title="Adicionar tag" aria-label="Adicionar tag">+</button></div>
    </article>`;
}

function ordemColunas() {
    const base = opcoesRotulos.map(r => r.nome);
    const salvo = Array.isArray(preferenciasUsuario.kanbanColunas) ? preferenciasUsuario.kanbanColunas : [];
    return [...salvo.filter(n => base.includes(n)), ...base.filter(n => !salvo.includes(n))];
}

function renderizarKanban() {
    const kb = document.getElementById('kanban');
    if (!kb) return;
    validarPastaAtual();
    const termo = window.__termoBusca || '';
    const guardado = kb.querySelector('.kb-board');
    const rolagem = guardado ? guardado.scrollLeft : 0;
    const padrao = opcoesRotulos[0].nome;
    const colunas = ordemColunas().map(nome => ({ nome, cor: obterCorRotulo(nome), itens: [] }));
    db.forEach((p, i) => {
        if ((p.pai || null) !== (pastaAtual || null)) return;
        const texto = [p.nome, p.rotulo, p.area, ...(p.tags || []).map(x => x.nome)].join(' ').toLowerCase();
        if (termo && !texto.includes(termo)) return;
        (colunas.find(c => c.nome === (p.rotulo || padrao)) || colunas.find(c => c.nome === padrao) || colunas[0]).itens.push(i);
    });
    const pai = pastaAtual ? ((pastaPorId(pastaAtual) || {}).pai || null) : null;
    const voltar = pastaAtual
        ? `<div class="kb-voltar" data-drop-pasta="${pai || ''}" onclick="irParaPasta(${pai ? `'${pai}'` : 'null'})">↰ Voltar para ${escapeHTML(pai ? pastaPorId(pai).nome : 'Workspace')}</div>`
        : '';
    kb.innerHTML = voltar + '<div class="kb-board">' + colunas.map(c => `
        <section class="kb-col" data-rotulo="${escapeHTML(c.nome)}">
            <header class="kb-col-topo" style="--cor-col:${c.cor}" title="Arraste para reordenar as colunas"><span class="alca-arrastar kb-col-alca">⠿</span><h3>${escapeHTML(c.nome)}</h3><span class="kb-conta">${c.itens.length}</span></header>
            <div class="kb-lista">${c.itens.map(htmlCardKanban).join('') || '<div class="kb-vazio">Sem itens</div>'}</div>
        </section>`).join('') + '</div>';
    kb.querySelector('.kb-board').scrollLeft = rolagem;
}

document.getElementById('kanban').addEventListener('click', e => {      // clique no card abre o projeto ou a pasta
    const card = e.target.closest('.kb-card');
    if (!card || e.target.closest('button, a, input')) return;
    const i = Number(card.dataset.idx), p = db[i];
    if (p.tipo === 'pasta') irParaPasta(p.id); else location.href = `cards.html?id=${i}`;
});

let arrastoKb = null;

document.addEventListener('pointerdown', e => {
    if (visaoAtual !== 'kanban' || e.button > 0 || !e.target.closest) return;
    const card = e.target.closest('.kb-card');
    if (!card || e.target.closest('button, a, input')) return;
    if (e.pointerType === 'touch' && !e.target.closest('.kb-alca')) return;   // no toque, só pela alça
    arrastoKb = { card, id: e.pointerId, x0: e.clientX, y0: e.clientY, ativo: false, ghost: null, alvo: null, depois: false, col: null, dentro: undefined };
});

window.addEventListener('pointermove', e => {
    const a = arrastoKb;
    if (!a || e.pointerId !== a.id) return;
    if (!a.ativo) {
        if (Math.hypot(e.clientX - a.x0, e.clientY - a.y0) < 6) return;
        a.ativo = true;
        a.card.classList.add('arrastando-origem');
        document.body.classList.add('arrastando');
        if (window.getSelection) window.getSelection().removeAllRanges();
        const g = document.createElement('div');
        g.className = 'ghost-arrasto';
        g.textContent = a.card.querySelector('.kb-titulo').textContent.trim();
        document.body.appendChild(g);
        a.ghost = g;
    }
    a.ghost.style.left = (e.clientX + 14) + 'px';
    a.ghost.style.top = (e.clientY + 10) + 'px';
    if (e.clientY < 70) window.scrollBy(0, -14); else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);
    const board = document.querySelector('#kanban .kb-board');
    if (board) {
        const r = board.getBoundingClientRect();
        if (e.clientX < r.left + 50) board.scrollLeft -= 16; else if (e.clientX > r.right - 50) board.scrollLeft += 16;
    }

    document.querySelectorAll('.drop-acima, .drop-abaixo, .drop-dentro, .drop-col')
        .forEach(x => x.classList.remove('drop-acima', 'drop-abaixo', 'drop-dentro', 'drop-col'));
    a.alvo = null; a.col = null; a.dentro = undefined;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !el.closest) return;
    const origem = db[Number(a.card.dataset.idx)];
    const podeIrPara = pastaId => !(origem.tipo === 'pasta' && (origem.id === pastaId || ehDescendente(origem.id, pastaId)))
        && (origem.pai || null) !== (pastaId || null);

    const zona = el.closest('[data-drop-pasta]');             // "voltar", Workspace e pastas do caminho
    if (zona) {
        const id = zona.dataset.dropPasta || null;
        if (podeIrPara(id)) { a.dentro = id; zona.classList.add('drop-dentro'); }
        return;
    }
    const alvo = el.closest('.kb-card');
    if (alvo && alvo !== a.card) {
        const r = alvo.getBoundingClientRect();
        const rel = (e.clientY - r.top) / r.height;
        if (alvo.classList.contains('kb-pasta') && rel > .25 && rel < .75) {   // meio da pasta = colocar dentro
            const idPasta = db[Number(alvo.dataset.idx)].id;
            if (podeIrPara(idPasta)) { a.dentro = idPasta; alvo.classList.add('drop-dentro'); }
            return;
        }
        a.alvo = alvo;
        a.depois = rel > .5;
        alvo.classList.add(a.depois ? 'drop-abaixo' : 'drop-acima');
        return;
    }
    const col = el.closest('.kb-col');
    if (col) { a.col = col; col.classList.add('drop-col'); }
});

function finalizarArrastoKb(e, cancelar) {
    const a = arrastoKb;
    if (!a || e.pointerId !== a.id) return;
    arrastoKb = null;
    if (!a.ativo) return;
    if (a.ghost) a.ghost.remove();
    document.body.classList.remove('arrastando');
    a.card.classList.remove('arrastando-origem');
    document.querySelectorAll('.drop-acima, .drop-abaixo, .drop-dentro, .drop-col')
        .forEach(x => x.classList.remove('drop-acima', 'drop-abaixo', 'drop-dentro', 'drop-col'));
    window.__arrastou = true;                                  // evita abrir o card ao soltar
    setTimeout(() => { window.__arrastou = false; }, 0);
    if (cancelar) return;

    const de = Number(a.card.dataset.idx);
    if (a.dentro !== undefined) { moverParaPasta(de, a.dentro); return; }
    const item = db[de];
    if (a.alvo) {                                              // solto antes/depois de outro card: assume a coluna dele
        const para = Number(a.alvo.dataset.idx);
        item.rotulo = db[para].rotulo || opcoesRotulos[0].nome;
        db.splice(de, 1);
        let pos = para > de ? para - 1 : para;
        if (a.depois) pos += 1;
        db.splice(pos, 0, item);
    } else if (a.col) {                                        // solto na coluna: vai para o fim dela
        item.rotulo = a.col.dataset.rotulo;
        db.splice(de, 1);
        db.push(item);
    } else {
        return;
    }
    salvarPastas();                                            // salva, envia à nuvem e redesenha
}
window.addEventListener('pointerup', e => finalizarArrastoKb(e, false));
window.addEventListener('pointercancel', e => finalizarArrastoKb(e, true));

let arrastoCol = null;

document.addEventListener('pointerdown', e => {                // arrastar o título da coluna reordena as colunas
    if (visaoAtual !== 'kanban' || e.button > 0 || !e.target.closest) return;
    const topo = e.target.closest('.kb-col-topo');

    arrastoCol = { col: topo.closest('.kb-col'), id: e.pointerId, x0: e.clientX, y0: e.clientY, ativo: false, ghost: null, alvo: null, depois: false };
});

window.addEventListener('pointermove', e => {
    const a = arrastoCol;
    if (!a || e.pointerId !== a.id) return;
    if (!a.ativo) {
        if (Math.hypot(e.clientX - a.x0, e.clientY - a.y0) < 6) return;
        a.ativo = true;
        a.col.classList.add('arrastando-origem');
        document.body.classList.add('arrastando');
        if (window.getSelection) window.getSelection().removeAllRanges();
        const g = document.createElement('div');
        g.className = 'ghost-arrasto';
        g.textContent = a.col.dataset.rotulo;
        document.body.appendChild(g);
        a.ghost = g;
    }
    a.ghost.style.left = (e.clientX + 14) + 'px';
    a.ghost.style.top = (e.clientY + 10) + 'px';
    const board = document.querySelector('#kanban .kb-board');
    if (board) {
        const r = board.getBoundingClientRect();
        if (e.clientX < r.left + 60) board.scrollLeft -= 18; else if (e.clientX > r.right - 60) board.scrollLeft += 18;
    }
    document.querySelectorAll('.kb-col.drop-esq, .kb-col.drop-dir').forEach(x => x.classList.remove('drop-esq', 'drop-dir'));
    a.alvo = null;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const alvo = el && el.closest ? el.closest('.kb-col') : null;
    if (!alvo || alvo === a.col) return;
    const r = alvo.getBoundingClientRect();
    a.alvo = alvo;
    a.depois = e.clientX > r.left + r.width / 2;
    alvo.classList.add(a.depois ? 'drop-dir' : 'drop-esq');
});

function finalizarArrastoCol(e, cancelar) {
    const a = arrastoCol;
    if (!a || e.pointerId !== a.id) return;
    arrastoCol = null;
    if (!a.ativo) return;
    if (a.ghost) a.ghost.remove();
    document.body.classList.remove('arrastando');
    a.col.classList.remove('arrastando-origem');
    document.querySelectorAll('.kb-col.drop-esq, .kb-col.drop-dir').forEach(x => x.classList.remove('drop-esq', 'drop-dir'));
    if (cancelar || !a.alvo) return;
    const nomes = [...document.querySelectorAll('#kanban .kb-col')].map(c => c.dataset.rotulo).filter(n => n !== a.col.dataset.rotulo);
    let i = nomes.indexOf(a.alvo.dataset.rotulo);
    if (a.depois) i++;
    nomes.splice(i, 0, a.col.dataset.rotulo);
    preferenciasUsuario.kanbanColunas = nomes;
    salvarPreferenciasBanco({ ...lerPreferenciasBanco(), kanbanColunas: nomes });
    renderizarKanban();
}
window.addEventListener('pointerup', e => finalizarArrastoCol(e, false));
window.addEventListener('pointercancel', e => finalizarArrastoCol(e, true));

/* ---------- Pastas: criar, abrir, mover (arrastando), renomear e excluir ---------- */
function pastaPorId(id) { return id ? db.find(x => x.tipo === 'pasta' && x.id === id) : null; }
function contarFilhos(id) { return db.filter(x => (x.pai || null) === id).length; }
function validarPastaAtual() { if (pastaAtual && !pastaPorId(pastaAtual)) pastaAtual = null; }

function caminhoDaPasta(id) {
    const cadeia = [];
    let atual = pastaPorId(id), guarda = 0;
    while (atual && guarda++ < 50) { cadeia.unshift(atual); atual = pastaPorId(atual.pai); }
    return cadeia;
}
/* true se "filhoId" está dentro de "paiId" (em qualquer nível) */
function ehDescendente(paiId, filhoId) {
    let x = pastaPorId(filhoId), guarda = 0;
    while (x && guarda++ < 50) { if ((x.pai || null) === paiId) return true; x = pastaPorId(x.pai); }
    return false;
}

function atualizarCaminho() {
    if (!window.BAHUB_Topo) return;
    const cadeia = caminhoDaPasta(pastaAtual);
    BAHUB_Topo.definirCaminho(cadeia.map((f, i) => ({
        nome: f.nome, pasta: f.id, href: i < cadeia.length - 1 ? 'index.html?pasta=' + f.id : null
    })));
}

function irParaPasta(id, historico = true) {
    pastaAtual = id || null;
    if (historico) {
        try {
            const u = new URL(location.href);
            if (pastaAtual) u.searchParams.set('pasta', pastaAtual); else u.searchParams.delete('pasta');
            history.pushState({}, '', u);
        } catch (e) { /* sem histórico (ex.: arquivo local) */ }
    }
    window.__termoBusca = '';
    const campo = document.getElementById('topo-busca');
    if (campo) campo.value = '';
    renderizarTabela();
}
window.addEventListener('popstate', () => {
    pastaAtual = new URLSearchParams(location.search).get('pasta') || null;
    renderizarTabela();
});
document.addEventListener('click', e => {                 // links do caminho navegam sem recarregar
    const a = e.target.closest && e.target.closest('#topo a[data-pasta]');
    if (!a) return;
    e.preventDefault();
    irParaPasta(a.dataset.pasta || null);
});

function salvarPastas() {
    salvarBancoDeDados(db);
    if (typeof enviarAgora === 'function') enviarAgora();
    renderizarTabela();
}
function criarPasta() {
    db.push({
        tipo: 'pasta',
        id: 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        nome: 'Nova pasta',
        rotulo: opcoesRotulos[0]?.nome || 'Em andamento',
        area: opcoesArea.includes('Gerais') ? 'Gerais' : opcoesArea[0],
        prazo: '---',
        pai: pastaAtual || null
    });
    salvarPastas();
}
function excluirPasta(index) {
    const p = db[index], n = contarFilhos(p.id);
    const msg = n
        ? `Excluir a pasta "${p.nome}"?\nOs ${n} item(ns) dentro dela serão movidos para o nível acima. Nada é apagado.`
        : `Excluir a pasta vazia "${p.nome}"?`;
    if (!confirm(msg)) return;
    db.forEach(x => { if (x.pai === p.id) x.pai = p.pai || null; });
    db.splice(index, 1);
    salvarPastas();
}
function moverParaPasta(de, pastaId) {
    const item = db[de];
    if (!item) return;
    if (item.tipo === 'pasta' && (item.id === pastaId || ehDescendente(item.id, pastaId))) return;
    db.splice(de, 1);
    item.pai = pastaId || null;
    db.push(item);
    salvarPastas();
}

function criarLinhaVoltar() {
    const pai = (pastaPorId(pastaAtual) || {}).pai || null;
    const nomePai = pai ? pastaPorId(pai).nome : 'Workspace';
    const tr = document.createElement('tr');
    tr.className = 'linha-voltar';
    tr.dataset.dropPasta = pai || '';
    tr.onclick = () => irParaPasta(pai);
    tr.innerHTML = `<td colspan="5"><div class="col-nome"><span>↰</span><span>Voltar para ${escapeHTML(nomePai)}</span></div></td>`;
    return tr;
}
function criarLinhaVazia() {
    const tr = document.createElement('tr');
    tr.className = 'linha-vazia';
    tr.innerHTML = '<td colspan="5">Pasta vazia. Crie uma página aqui ou arraste itens para dentro dela.</td>';
    return tr;
}

const NOMES_COLUNAS = { nome: 'Título', rotulo: 'Rótulo', area: 'Área', prazo: 'Prazo' };

/* Transforma a ordenação que está na tela na ordem personalizada salva (vai para a nuvem). */
function adotarOrdemAtual() {
    const posicoes = db.map((_, i) => i).filter(i => (db[i].pai || null) === (pastaAtual || null));
    const ordenados = calcularOrdemVisual().map(i => db[i]);
    posicoes.forEach((pos, k) => { db[pos] = ordenados[k]; });
    ordenacaoAtual = null;
    direcaoOrdenacao = 1;
    salvarPreferenciasBanco({
        ...lerPreferenciasBanco(),
        ordenacao: null
    });
    salvarBancoDeDados(db);
    if (typeof enviarAgora === 'function') enviarAgora();
    renderizarTabela();
}

function usarOrdemPersonalizada() {
    ordenacaoAtual = null;
    direcaoOrdenacao = 1;
    salvarPreferenciasBanco({
        ...lerPreferenciasBanco(),
        ordenacao: null
    });
    renderizarTabela();
}

function atualizarBarraOrdem() {
    document.querySelectorAll('.cabecalho-clicavel').forEach(th => {
        const m = (th.getAttribute('onclick') || '').match(/'(\w+)'/);
        th.dataset.ordem = m && m[1] === ordenacaoAtual ? (direcaoOrdenacao === 1 ? 'asc' : 'desc') : '';
    });
    const barra = document.getElementById('barra-ordem');
    if (!barra) return;
    barra.innerHTML = ordenacaoAtual
        ? `<span>Visualização ordenada por <strong>${NOMES_COLUNAS[ordenacaoAtual]}</strong> ${direcaoOrdenacao === 1 ? '↑' : '↓'} · Arraste desativado</span>
           <span class="barra-acoes"><button type="button" class="btn-ordem" onclick="adotarOrdemAtual()">Salvar como minha ordem</button><button type="button" class="btn-ordem" onclick="usarOrdemPersonalizada()">Voltar à ordem personalizada</button></span>`
        : '<span>⠿ Ordem personalizada · arraste para reorganizar ou solte sobre uma pasta</span>';
}

let arrasto = null;

document.addEventListener('pointerdown', e => {
    if (ordenacaoAtual || e.button > 0 || !e.target.closest) return;
    const tr = e.target.closest('#corpo-tabela tr');
    if (!tr || tr.classList.contains('em-edicao') || !tr.id.startsWith('linha-projeto-')) return;
    if (e.target.closest('button, input, select, a, .col-acoes')) return;
    if (e.pointerType === 'touch' && !e.target.closest('.alca-arrastar')) return;   // no toque, só pela alça
    arrasto = { tr, id: e.pointerId, x0: e.clientX, y0: e.clientY, ativo: false, ghost: null, alvo: null, depois: false };
});

window.addEventListener('pointermove', e => {
    if (!arrasto || e.pointerId !== arrasto.id) return;
    if (!arrasto.ativo) {
        if (Math.hypot(e.clientX - arrasto.x0, e.clientY - arrasto.y0) < 6) return;
        arrasto.ativo = true;
        arrasto.tr.classList.add('arrastando-origem');
        document.body.classList.add('arrastando');
        if (window.getSelection) window.getSelection().removeAllRanges();
        const nome = arrasto.tr.querySelector('.titulo-linha');
        const g = document.createElement('div');
        g.className = 'ghost-arrasto';
        g.textContent = nome ? nome.textContent.trim() : 'Projeto';
        document.body.appendChild(g);
        arrasto.ghost = g;
    }
    arrasto.ghost.style.left = (e.clientX + 14) + 'px';
    arrasto.ghost.style.top = (e.clientY + 10) + 'px';

    if (e.clientY < 70) window.scrollBy(0, -14);
    else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);

    document.querySelectorAll('.drop-acima, .drop-abaixo, .drop-dentro')
        .forEach(r => r.classList.remove('drop-acima', 'drop-abaixo', 'drop-dentro'));
    arrasto.alvo = null;
    arrasto.dentro = undefined;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (!el || !el.closest) return;
    const origem = db[Number(arrasto.tr.id.replace('linha-projeto-', ''))];
    const podeIrPara = pastaId => !(origem.tipo === 'pasta' && (origem.id === pastaId || ehDescendente(origem.id, pastaId)))
        && (origem.pai || null) !== (pastaId || null);

    const zona = el.closest('[data-drop-pasta]');          // linha "voltar", Workspace e pastas do caminho
    if (zona) {
        const id = zona.dataset.dropPasta || null;
        if (podeIrPara(id)) { arrasto.dentro = id; zona.classList.add('drop-dentro'); }
        return;
    }
    const alvo = el.closest('#corpo-tabela tr');
    if (!alvo || alvo === arrasto.tr || !alvo.id.startsWith('linha-projeto-')) return;
    const r = alvo.getBoundingClientRect();
    const rel = (e.clientY - r.top) / r.height;
    if (alvo.classList.contains('linha-pasta') && rel > .25 && rel < .75) {   // meio da pasta = colocar dentro
        const idPasta = db[Number(alvo.id.replace('linha-projeto-', ''))].id;
        if (podeIrPara(idPasta)) { arrasto.dentro = idPasta; alvo.classList.add('drop-dentro'); }
        return;
    }
    arrasto.alvo = alvo;
    arrasto.depois = rel > .5;
    alvo.classList.add(arrasto.depois ? 'drop-abaixo' : 'drop-acima');
});

function finalizarArrasto(e, cancelar) {
    if (!arrasto || e.pointerId !== arrasto.id) return;
    const a = arrasto;
    arrasto = null;
    if (!a.ativo) return;
    if (a.ghost) a.ghost.remove();
    document.body.classList.remove('arrastando');
    a.tr.classList.remove('arrastando-origem');
    document.querySelectorAll('.drop-acima, .drop-abaixo, .drop-dentro').forEach(r => r.classList.remove('drop-acima', 'drop-abaixo', 'drop-dentro'));
    window.__arrastou = true;                       // evita abrir o projeto ao soltar
    setTimeout(() => { window.__arrastou = false; }, 0);
    if (cancelar) return;
    const de = Number(a.tr.id.replace('linha-projeto-', ''));
    if (a.dentro !== undefined) { moverParaPasta(de, a.dentro); return; }
    if (!a.alvo) return;
    const para = Number(a.alvo.id.replace('linha-projeto-', ''));
    const [item] = db.splice(de, 1);
    let pos = para > de ? para - 1 : para;
    if (a.depois) pos += 1;
    db.splice(pos, 0, item);
    salvarBancoDeDados(db);                          // a ordem personalizada fica salva (e vai para a nuvem)
    if (typeof enviarAgora === 'function') enviarAgora();
    renderizarTabela();
}
window.addEventListener('pointerup', e => finalizarArrasto(e, false));
window.addEventListener('pointercancel', e => finalizarArrasto(e, true));
document.addEventListener('click', e => {
    if (window.__arrastou) { e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener('dragstart', e => { if (arrasto && arrasto.ativo) e.preventDefault(); });

function aplicarBusca() {
    const termo = window.__termoBusca || '';
    document.querySelectorAll('#corpo-tabela tr').forEach(tr => {
        tr.style.display = !termo || tr.textContent.toLowerCase().includes(termo) ? '' : 'none';
    });
}
window.aoBuscar = t => { window.__termoBusca = t; aplicarBusca(); if (visaoAtual === 'kanban') renderizarKanban(); };
window.aoNovoRegistro = abrirModal;
window.aoNovaPasta = criarPasta;
const _renderizarTabelaBase = renderizarTabela;
renderizarTabela = function () { _renderizarTabelaBase(); atualizarBarraOrdem(); atualizarCaminho(); aplicarBusca(); aplicarVisao(); };

renderizarTabela();

</script>
<script>
BAHUB_PRONTO.then(() => {
    const s = document.createElement('script');
    s.textContent = document.getElementById('app-script').textContent;
    document.body.appendChild(s);
});
</script>
